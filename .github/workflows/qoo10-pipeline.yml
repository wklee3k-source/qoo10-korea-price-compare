name: Qoo10 Pipeline

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "검색할 상품명(핵심 문구) — scrape 작업용"
        required: false
        type: string
      discovery_keyword_ja:
        description: "저리뷰 상점 발굴 시작 검색어(일본어) — 비워두면 스케줄 실행과 동일한 기본값 사용"
        required: false
        type: string
      discovery_max_shops:
        description: "이번 실행에서 추가로 더 방문할 상점 수(누적 아님, 이번 실행분만)"
        required: false
        type: string
        default: "100"
      discovery_target_products:
        description: "목표 상품 수(이번 실행 기준 상한)"
        required: false
        type: string
        default: "500"
      discovery_shops_per_keyword:
        description: "검색어 1개당 최대 몇 개 상점까지 처리할지(비워두면 제한없음)"
        required: false
        type: string
      discovery_parallel:
        description: "병렬(matrix 4개 브랜치)로 돌릴지 — 각자 자기 전용 파일에만 저장(병합 안 함). 병합은 run_merge_discovery로 별도 실행"
        required: false
        type: boolean
        default: false
      run_merge_discovery:
        description: "[1.5단계] 4개 워커가 각자 쓴 discovery_state_<0~3>.json을 discovery_state.json 하나로 합칠지"
        required: false
        type: boolean
        default: false
      run_harvest_catalog:
        description: "이미 발굴된 상점(discovery-live)의 전체상품을 랭크5 말고 다 훑을지(색조제외, 리뷰수20이하). fullcatalog-live 브랜치에 저장(discovery-live와 완전분리)"
        required: false
        type: boolean
        default: false
      run_merge_harvest:
        description: "12워커가 각자 쓴 fullcatalog_state_<N>.json을 fullcatalog_state.json 하나로 합칠지. 발굴본과 겹치는 상품은 발굴을 우선하고 수확본에서 제외한다"
        required: false
        type: boolean
        default: false
      hold_discovery:
        description: "발굴을 대기 상태로 둘지. true면 병합 후 자동 재기동과 시간기반 안전망(ensure_discovery_alive)이 모두 꺼져서, 발굴이 멈춘 채로 유지된다(번역/검증에 자원을 몰아줄 때 사용)"
        required: false
        type: boolean
        default: false
      run_hwahae_verify:
        description: "output/hwahae_input_39.json을 화해로 검증할지"
        required: false
        type: boolean
        default: false
      run_discovery:
        description: "1단계(저리뷰 상점 크롤링)를 돌릴지 — 이걸 꺼두면 다른 job(화해검증 등)만 단독 실행 가능"
        required: false
        type: boolean
        default: false
      naver_test_query:
        description: "네이버쇼핑 API 테스트용 검색어 (비워두면 이 job 안 돎)"
        required: false
        type: string
  push:
    paths:
      - "output/*_korea_side.json"

jobs:
  scrape:
    if: github.event_name == 'workflow_dispatch' && inputs.keyword != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run pipeline
        working-directory: src
        run: python pipeline.py "${{ inputs.keyword }}"

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Auto: pipeline run for '${{ inputs.keyword }}'"
          git push

  discover_low_review_shops:
    # 저리뷰 상점/상품 자동발굴(순차 버전) — discovery_parallel=false일 때만 돈다.
    # 진짜 백그라운드 실행(사람이 세션을 안 열고 있어도 GitHub 서버에서 계속 돎).
    # 상태는 output/discovery_state.json에 저장되므로 타임아웃 걸려도 다시
    # 실행하면 이어서 진행된다.
    # [비활성화됨] cron-job.org 외부 스케줄이 이 job(병렬버전 없는 구버전
    # 트리거)을 계속 호출해서 병렬버전과 동시에 discovery-live에 커밋하며
    # 충돌을 일으켰다. cron-job.org 자체는 여기서 끌 수 없으므로(외부 서비스),
    # 이 job을 항상 false 조건으로 비활성화해서 크론이 호출해도 무해하게
    # 만든다 — 이제 discover는 병렬버전(discovery_parallel=true)만 쓴다.
    if: false && github.event_name == 'workflow_dispatch' && inputs.run_discovery && !inputs.discovery_parallel
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - name: Switch to dedicated branch (avoids push contention with hwahae_verify)
        run: |
          git fetch origin discovery-live 2>/dev/null && git checkout discovery-live || git checkout -b discovery-live
          git merge origin/main --no-edit -X theirs 2>/dev/null || true
          # [안전장치] merge가 조용히 실패해서 코드 파일이 낡은 채로 남는
          # 사고가 실측으로 확인됐다(translate_in_place.py 없어서 8워커
          # 전부 크래시). merge 성공여부와 무관하게 항상 최신 코드로
          # 강제 동기화한다(각 브랜치 고유의 output/ 데이터는 안 건드림).
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ comparison/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (캐시 miss일 때만)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (캐시 hit여도 필요)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # 매일 "+100개 상점"이 되도록, 지금까지 누적 방문한 상점 수를 읽어서
      # 오늘의 목표 상점수(cap) = 기존 누적 + 이번 실행분(기본 100)으로 계산한다.
      # workflow_dispatch로 수동 실행할 때 값을 직접 넣으면 그 값을 우선한다.
      - name: Compute today's shop cap
        id: cap
        working-directory: src
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('../output/discovery_state.json')
          visited = len(json.loads(p.read_text())['visited_shops']) if p.exists() else 0
          increment = int('${{ inputs.discovery_max_shops }}' or '100')
          print(f'start={visited}')
          print(f'cap={visited + increment}')
          " >> "$GITHUB_OUTPUT"

      # 상점 2개 단위로 나눠서 반복 실행하고, 매 단위가 끝날 때마다 즉시
      # 커밋+푸시한다 — 이러면 실행이 다 끝나기 전에도 GitHub에서 지금까지
      # 몇 개나 처리됐는지 중간에 확인할 수 있다(전에는 끝까지 기다려야만
      # 결과가 보였다).
      - name: Run discovery in small increments (checkable mid-run)
        working-directory: src
        env:
          KEYWORD: ${{ inputs.discovery_keyword_ja || 'メディヒール エッセンシャルマスクパック' }}
          TARGET: ${{ inputs.discovery_target_products || '500' }}
          START: ${{ steps.cap.outputs.start }}
          FINAL_CAP: ${{ steps.cap.outputs.cap }}
          SHOPS_PER_KEYWORD: ${{ inputs.discovery_shops_per_keyword || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [30->2 되돌림] 병렬버전과 값을 맞춘다.
          STEP=2
          current=$START
          while [ "$current" -lt "$FINAL_CAP" ]; do
            next=$((current + STEP))
            if [ "$next" -gt "$FINAL_CAP" ]; then next=$FINAL_CAP; fi
            echo "::group::상점 목표 $current -> $next"
            python iterative_low_review_discovery.py \
              "$KEYWORD" \
              "$TARGET" \
              ../output/discovery_result.xlsx \
              "$next" \
              "$SHOPS_PER_KEYWORD"
            echo "::endgroup::"

            python append_progress_history.py ../output
            # [버그수정] archive/ 폴더가 없으면 git add가 나열된 경로 전체를
            # 통째로 실패시켜(pathspec 오류), discovery_state.json 등 실제
            # 존재하는 파일까지 같이 스테이징이 안 되는 사고가 있었다(실측
            # 확인: 병합이 상품 458건을 만들어놓고도 이 문제로 그대로
            # 날아감). archive/는 있을 때만 별도로 add한다.
            git add ../output/discovery_state.json ../output/discovery_result.xlsx ../output/discovery_skip_log.json ../output/discovery_seed_log.json ../output/progress_history.json 2>/dev/null || true
            [ -d ../output/archive ] && git add ../output/archive/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Auto: discovery progress (상점 목표 $next)"
              for i in 1 2 3; do
                if git push origin discovery-live; then break; fi
                echo "push 실패, pull --rebase 후 재시도 ($i/3)"
                git pull --rebase origin discovery-live
              done
            fi
            current=$next
          done

  discover_low_review_shops_parallel:
    # 병렬 버전 — 4개 브랜치(matrix)가 동시에 각자 다른 시드를 처리한다.
    # [실시간 병합] 예전엔 각자 아티팩트에만 저장하고 4개가 "전부" 끝나야
    # 별도 job이 병합했는데, discover는 사실상 무한루프(끝나는 조건이
    # 거의 없음)라 실질적으로 병합이 몇 시간에 한 번(타임아웃)만 일어나는
    # 구조적 문제가 있었다. 이제 각 워커가 순차버전처럼 작은 단위(상점
    # 2개)로 나눠서 반복하고, 매 단위가 끝날 때마다 자기 전용 파일에 저장 +
    # discovery-live의 최신본을 받아와서 병합 + 즉시 커밋/push한다. 서로
    # 다른 파일(discovery_state_<branch>.json)에 쓰므로 병합 자체는 안전하고,
    # 메인 파일 push 경합은 재시도+지터로 흡수한다.
    if: github.event_name == 'workflow_dispatch' && inputs.discovery_parallel
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      actions: write
    concurrency:
      group: discover-parallel-branch-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      matrix:
        # [12 -> 2 축소] '하루 100건, 양보다 질' 방침. 시뮬레이션상
        # 하루 100건 검수하려면 상점 164곳만 방문하면 되므로 2워커면
        # 충분하다(워커당 82곳). 사이트 부하와 차단 위험도 함께 줄어든다.
        branch: [0, 1]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - name: Switch to dedicated branch (same as sequential discover)
        run: |
          git fetch origin discovery-live 2>/dev/null && git checkout discovery-live || git checkout -b discovery-live
          git merge origin/main --no-edit -X theirs 2>/dev/null || true
          # [안전장치] merge가 조용히 실패해서 코드 파일이 낡은 채로 남는
          # 사고가 실측으로 확인됐다(translate_in_place.py 없어서 8워커
          # 전부 크래시). merge 성공여부와 무관하게 항상 최신 코드로
          # 강제 동기화한다(각 브랜치 고유의 output/ 데이터는 안 건드림).
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ comparison/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (캐시 miss일 때만)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (캐시 hit여도 필요)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # 메인 discovery_state.json의 시드를 4등분해서 이 브랜치(matrix.branch)
      # 몫만 이 브랜치 전용 상태파일(discovery_state_<branch>.json)에 저장한다.
      # 이미 이 브랜치 전용 파일이 있으면(재실행) 그대로 이어서 쓴다.
      # [v3.1.0 신규] 수확본을 읽기전용으로 받아둔다 — 검색어가 고갈된
      # 워커를 되살릴 재료다. fullcatalog-live는 완전히 다른 브랜치이므로
      # 체크아웃하지 않고 --depth 1로 받아 파일만 꺼낸다(.git 비대화 방지).
      - name: Fetch harvest pool (read-only, for keyword refill)
        run: |
          mkdir -p /tmp/fcpool
          if git fetch --depth 1 origin fullcatalog-live 2>/dev/null; then
            for N in 0 1 2 3 4 5; do
              git show FETCH_HEAD:output/fullcatalog_state_${N}.json > "/tmp/fcpool/fullcatalog_state_${N}.json" 2>/dev/null \
                || rm -f "/tmp/fcpool/fullcatalog_state_${N}.json"
            done
            echo "[수확본] $(ls /tmp/fcpool | wc -l)개 샤드 확보"
          else
            echo "[경고] fullcatalog-live를 못 받음 — 검색어 보충은 건너뛴다"
          fi

      - name: Prepare this branch's seed keywords
        working-directory: src
        run: |
          python3 -c "
          import json, pathlib
          suffix = '${{ matrix.branch }}'
          branch_path = pathlib.Path(f'../output/discovery_state_{suffix}.json')
          if branch_path.exists():
              print('이미 이 브랜치 상태파일이 있어서 이어서 진행')
          else:
              main_path = pathlib.Path('../output/discovery_state.json')
              main_state = json.loads(main_path.read_text()) if main_path.exists() else {'pending_keywords': None}
              all_seeds = main_state.get('pending_keywords') or ['メディヒール エッセンシャルマスクパック']
              my_seeds = [kw for i, kw in enumerate(all_seeds) if i % 2 == int(suffix)]  # 워커수(2)와 반드시 일치해야 함
              if not my_seeds:
                  my_seeds = [all_seeds[int(suffix) % len(all_seeds)]]
              branch_path.write_text(json.dumps({
                  'visited_shops': [], 'all_products': [], 'shop_urls': [],
                  'pending_keywords': my_seeds, 'seen_keywords': []
              }, ensure_ascii=False, indent=2))
              print(f'브랜치 {suffix} 시드 {len(my_seeds)}개:', my_seeds)
          "

      # [v3.1.0 신규 — 실측 사고 대응] 위 단계는 '파일이 없을 때' 딱 한 번만
      # 시드를 나눠준다. 그래서 파일이 이미 있는 워커의 pending_keywords가
      # 0이 되면 그 워커는 영원히 빈 실행만 반복한다(실측 2026-07-28:
      # 워커0 2,237개 / 워커1 0개 → 발굴 처리량 50% 손실, 통합본 pending도 0).
      # 고갈되면 수확본 상품명에서 새 검색어를 뽑아 자동으로 채운다.
      # --workers 2 는 위 matrix.branch 개수(2)와 반드시 같아야 한다.
      - name: Refill seed keywords if exhausted
        working-directory: src
        run: |
          python3 refill_discovery_keywords.py \
            --state "../output/discovery_state_${{ matrix.branch }}.json" \
            --worker "${{ matrix.branch }}" \
            --workers 2 \
            --pool /tmp/fcpool \
            --peer-dir ../output \
            --limit 4000 \
            --threshold 0 || echo "[경고] 검색어 보충 실패 — 이번 실행은 기존 큐로 진행"

      # 상점 몇 개 단위로 나눠서 반복 실행하고, 매 단위마다 즉시 커밋+push한다
      # (실시간). 4개가 전부 끝날 때까지 안 기다려도 지금까지 몇 개나
      # 처리됐는지 discovery-live에서 바로 확인 가능하다.
      #
      # [이벤트 기반 자동연계] 1단계(발굴)는 순수 발굴만 한다. 번역은 더
      # 이상 여기서 안 하고 1.5단계(병합)로 옮겼다 — 한 곳에서만 번역
      # API를 호출해야 배치를 크게 모을 수 있고, 병합본(2단계가 실제로
      # 보는 파일)과 번역상태가 항상 일치한다. 대신 이 워커가 신규상품을
      - name: Run discovery in small increments (own file only)
        working-directory: src
        env:
          TARGET: ${{ inputs.discovery_target_products || '999999' }}
          SHOPS_PER_KEYWORD: ${{ inputs.discovery_shops_per_keyword || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          B="${{ matrix.branch }}"
          # [30 -> 2 되돌림] v1.8.0에서 '재검색 낭비를 줄이자'며 3->30으로
          # 올렸는데, 실전에서 부작용이 훨씬 컸다: 상점 30곳을 다 채워야
          # 커밋되니 26분간 진행상황이 전혀 안 보였고(실측), '자주 저장해서
          # 중간에 죽어도 잃지 않는다'는 원래 설계 의도가 깨졌다.
          # 상점 2곳마다 커밋하도록 되돌린다 — 재검색이 늘어나는 비용보다
          # 진행 가시성과 유실 방지가 우선이다.
          STEP=2
          ITER=0
          while true; do
            ITER=$((ITER + 1))
            # [중요] max_shops는 "이번 호출에서 몇 개 방문할지"가 아니라
            # "누적 visited_shops가 몇 개 되면 멈출지"다(스크립트 내부:
            # len(visited_shops) >= max_shops면 즉시 STOP). 고정값(STEP)을
            # 매번 그대로 넘기면, 1회차 이후로는 이미 누적치가 그 값을
            # 넘어서 있으니 2회차부터 계속 "즉시 멈춤"만 반복하는 버그가
            # 있었다(실측: 283회 중 사실상 1회만 유효했음). 순차버전처럼
            # 매번 "현재 누적 + STEP"을 다시 계산해서 넘긴다.
            CURRENT_VISITED=$(python3 -c "import json, pathlib; p = pathlib.Path('../output/discovery_state_${B}.json'); print(len(json.loads(p.read_text())['visited_shops']) if p.exists() else 0)")
            CAP=$((CURRENT_VISITED + STEP))
            echo "::group::브랜치 $B 반복 $ITER (누적 $CURRENT_VISITED -> 목표 $CAP)"
            python iterative_low_review_discovery.py \
              "" \
              "$TARGET" \
              "../output/discovery_result_${B}.xlsx" \
              "$CAP" \
              "$SHOPS_PER_KEYWORD" \
              "$B"
            echo "::endgroup::"

            # [경합/느려짐 방지] 4개 워커 전부 똑같이, 오직 자기 전용 파일만
            # 커밋/push한다. discovery_state.json(공유파일)은 절대 안 건드린다
            # — 그래서 워커끼리는 파일이 겹칠 일이 구조적으로 없다. 병합은
            # 이 job이 아니라 완전히 별도인 "1.5단계"(merge_discovery_shards)
            # job이 전담한다.
            #
            # [중요 버그 수정] 예전엔 매 반복마다 즉시 push를 시도했는데,
            # 다른 워커/병합job이 매우 자주 discovery-live에 커밋하는
            # 상황에서는 30번 재시도로도 못 따라잡아 push가 통째로 실패하고
            # 몇 시간치 작업(실측: 128개 상점)이 그대로 유실되는 사고가 있었다.
            # 이제 3반복(최대 9개 상점)마다 한 번만 push해서 시도 빈도를
            # 줄이고, 재시도도 "git pull --rebase"(바이너리 파일 있으면
            # 종종 조용히 실패) 대신 "내 파일을 백업 -> origin 최신으로
            # 리셋 -> 백업 복원 -> 재커밋" 방식을 써서 확실하게 성공시킨다.
            git add "../output/discovery_state_${B}.json" "../output/discovery_result_${B}.xlsx" 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Auto: parallel discovery branch $B own-file progress (반복 $ITER)"
            fi

            # [2순위 개선에 맞춘 조정] STEP을 3->30으로 올렸으니, 예전처럼
            # 3회차마다 push하면 한 번에 최대 90개 상점(STEP×3)이 push 전에
            # 로컬(휘발성 VM)에만 있게 되어 유실 위험창이 3배로 커진다.
            # 이제 매 회차마다 push해서 위험창을 STEP=30 수준(예전의 최대
            # 9개보다는 크지만, 3배가 아니라 원래 취지에 맞게 억제)으로
            # 되돌린다.
            PUSHED=0
            for i in $(seq 1 40); do
              if git push origin discovery-live; then PUSHED=1; break; fi
              sleep_time=$((RANDOM % 5 + 1))
              echo "push 실패(경합), ${sleep_time}초 대기 후 재시도 ($i/40)"
              sleep "$sleep_time"
              # 내 전용 파일을 안전하게 백업해두고, origin 최신본으로
              # 완전히 리셋한 뒤, 백업을 되살려 다시 커밋한다(rebase보다
              # 확실함 — 내 파일은 나만 쓰니 항상 최신이 곧 정답).
              cp "../output/discovery_state_${B}.json" "/tmp/dstate_${B}_backup.json" 2>/dev/null || true
              cp "../output/discovery_result_${B}.xlsx" "/tmp/dresult_${B}_backup.xlsx" 2>/dev/null || true
              git fetch origin discovery-live 2>/dev/null
              git reset --hard origin/discovery-live -q 2>/dev/null || true
              # reset이 최신코드까지 되돌리므로 다시 맞춘다(안 하면 다음
              # 반복부터 낡은 스크립트로 발굴하게 된다).
              git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true
              cp "/tmp/dstate_${B}_backup.json" "../output/discovery_state_${B}.json" 2>/dev/null || true
              cp "/tmp/dresult_${B}_backup.xlsx" "../output/discovery_result_${B}.xlsx" 2>/dev/null || true
              git add "../output/discovery_state_${B}.json" "../output/discovery_result_${B}.xlsx" 2>/dev/null || true
              git diff --cached --quiet || git commit -m "Auto: parallel discovery branch $B own-file progress (반복 $ITER, 재시도)"
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::warning::브랜치 $B: 40회 재시도에도 push 실패. 로컬 파일은 다음 반복에서 이어서 커밋 시도됨"
            fi
          done

  harvest_full_catalog_parallel:
    # [전체상품 수확] 이미 발굴된 상점(discovery-live의 visited_shops)의
    # 랭크5(베스트5)가 아니라 전체상품을 훑는다. 필터: 색조제외/화장품
    # 카테고리 화이트리스트/리뷰수20이하만 저장. discovery-live와 완전히
    # 분리된 fullcatalog-live 브랜치에 저장한다 — discovery-live를
    # 건드리면 발굴 워커와 push 경합이 생기고(과거실패 #2·#4 재발위험),
    # 이 job은 discovery-live를 읽기만 하고 절대 쓰지 않는다.
    if: github.event_name == 'workflow_dispatch' && inputs.run_harvest_catalog
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      matrix:
        # [경합 완화] 12워커가 fullcatalog-live에 동시에 push하다가 경합이
        # 너무 잦아서(실측: 12개 중 10개가 40회 재시도 끝에 push 실패)
        # 6워커로 줄인다. 아래 SHOPS 배정의 나머지 연산도 %6으로 맞춰야
        # 6~11번 상점이 누락되지 않는다(같이 수정함).
        branch: [0, 1, 2, 3, 4, 5]
      fail-fast: false
    concurrency:
      group: harvest-catalog-branch-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - name: Switch to dedicated branch (avoids push contention with discover)
        run: |
          git fetch origin fullcatalog-live 2>/dev/null && git checkout fullcatalog-live || git checkout -b fullcatalog-live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --break-system-packages -q playwright 2>/dev/null || pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Harvest full catalog for this shard's shops
        working-directory: src
        run: |
          B="${{ matrix.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BATCH=50
          NO_PROGRESS=0
          MAX_NO_PROGRESS=3  # 연속 무진전 허용 횟수(harvest의 MAX_RETRIES=3과 맞춤)
          ITER=0
          while true; do
            ITER=$((ITER + 1))
            # discovery-live의 visited_shops는 읽기만 한다(절대 안 씀). 이 job은
            # fullcatalog-live만 체크아웃했으므로 origin/discovery-live 참조가
            # 로컬에 아직 없다 — 매 반복마다 fetch해서 최신 목록을 받는다
            # (발굴이 계속 진행 중이면 방문상점 수도 계속 늘어나므로).
            #
            # [실측버그 수정] actions/checkout@v4는 기본적으로 얕은(depth=1)+
            # 단일브랜치 클론이라, remote.origin.fetch refspec이 main
            # 하나로만 좁혀져 있다. 그 상태에서 'git fetch origin
            # discovery-live'를 해도 origin/discovery-live라는 원격추적
            # 참조는 안 만들어지고 FETCH_HEAD만 갱신된다(실측 재현:
            # 'git show origin/discovery-live:...' -> "fatal: invalid
            # object name" 이었는데, 'git show FETCH_HEAD:...'는 정상
            # 작동함을 확인). 그래서 origin/discovery-live 대신
            # FETCH_HEAD를 참조한다.
            git fetch origin discovery-live 2>/dev/null
            SHOPS=$(git show FETCH_HEAD:output/discovery_state.json 2>/dev/null | \
              python3 -c "
          import json, sys, zlib
          raw = sys.stdin.read()
          if not raw.strip():
              # discovery-live를 아직 못 읽었으면(fetch 실패 등) 빈 목록으로
              # 처리하고, 바깥 while 루프가 30초 대기 후 다음 반복에서
              # 다시 시도한다 — 여기서 죽으면 job 전체가 실패로 끝난다.
              print('')
              sys.exit(0)
          d = json.loads(raw)
          all_shops = sorted(d['visited_shops'])
          # [중요] 파이썬 내장 hash()는 프로세스마다 랜덤(PYTHONHASHSEED)이라
          # 재실행할 때마다 상점이 다른 브랜치로 재배정되는 심각한 버그가
          # 된다(같은 상점을 여러 워커가 중복 수확하거나, 어떤 상점은 영영
          # 안 배정될 수 있음). zlib.crc32는 입력이 같으면 항상 같은 값을
          # 내는 결정적 해시라 안전하다.
          mine = [s for s in all_shops if zlib.crc32(s.encode()) % 6 == $B]
          print(' '.join(mine))
          ")
            if [ -z "$SHOPS" ]; then
              echo "[대기] discovery-live에 이 브랜치(${B}) 몫 상점이 아직 없음"
              sleep 30
              continue
            fi
            HARVESTED=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('../output/fullcatalog_state_${B}.json')
          print(len(json.loads(p.read_text())['harvested_shops']) if p.exists() else 0)
          ")
            TODO=$(python3 -c "
          import json
          harvested_path = '../output/fullcatalog_state_${B}.json'
          try:
              harvested = set(json.load(open(harvested_path))['harvested_shops'])
          except FileNotFoundError:
              harvested = set()
          shops = '''$SHOPS'''.split()
          todo = [s for s in shops if s not in harvested][:$BATCH]
          print(' '.join(todo))
          ")
            if [ -z "$TODO" ]; then
              echo "[완료] 브랜치 ${B} 몫 상점 전부 수확 완료(누적 ${HARVESTED}개)"
              break
            fi
            echo "::group::브랜치 $B 반복 $ITER (이번 배치 $(echo $TODO | wc -w)개, 누적수확 $HARVESTED)"
            python harvest_full_catalog.py "$B" $TODO
            echo "::endgroup::"

            git add "../output/fullcatalog_state_${B}.json" 2>/dev/null || true
            git diff --cached --quiet || git commit -m "Auto: full-catalog harvest branch $B progress (반복 $ITER)"

            PUSHED=0
            for i in $(seq 1 40); do
              if git push origin fullcatalog-live; then PUSHED=1; break; fi
              sleep_time=$((RANDOM % 5 + 1))
              sleep "$sleep_time"
              cp "../output/fullcatalog_state_${B}.json" "/tmp/fcstate_${B}_backup.json" 2>/dev/null || true
              git fetch origin fullcatalog-live 2>/dev/null
              git reset --hard origin/fullcatalog-live -q 2>/dev/null || true
              git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true
              cp "/tmp/fcstate_${B}_backup.json" "../output/fullcatalog_state_${B}.json" 2>/dev/null || true
              git add "../output/fullcatalog_state_${B}.json" 2>/dev/null || true
              git diff --cached --quiet || git commit -m "Auto: full-catalog harvest branch $B progress (반복 $ITER, 재시도)"
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::warning::브랜치 $B: push 40회 재시도 실패"
            fi

            # [무한반복 방지 - 재확인중 발견] 화해검증 루프(hwahae_verify)에는
            # 있는 "진행 없음 -> 중단" 가드가 여기엔 빠져 있었다. TODO가
            # 비었을 때만 break하는데, 큐텐이 광범위 장애를 겪거나 IP가
            # 막히면 매 반복 BATCH(50)개 상점을 실패로 소진하며 무한정
            # 커밋을 이어간다(과거 discovery-live 커밋폭탄 86,269건과 같은
            # 위험). 커밋/푸시가 끝난 뒤에 확인해서 진행상황(실패 카운트
            # 포함)은 안전하게 저장한 상태로 중단한다.
            #
            # [연속 3회 허용 이유] harvest_full_catalog.py는 크롤 실패한
            # 상점을 MAX_RETRIES(3)회 채워야 harvested에 넣는다. 그래서
            # 무진전 1회에 바로 나가버리면, 그 3회 재시도 로직이 한 실행
            # 안에서는 절대 완주하지 못한다(1회차엔 failed=1만 쌓이고
            # harvested는 그대로라 즉시 break). 연속 3회까지 허용해서
            # 재시도가 자연히 소진되게 하되, 그 이상이면 진짜 장애로
            # 보고 중단한다.
            HARVESTED_AFTER=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('../output/fullcatalog_state_${B}.json')
          print(len(json.loads(p.read_text())['harvested_shops']) if p.exists() else 0)
          ")
            if [ "$HARVESTED_AFTER" -eq "$HARVESTED" ]; then
              NO_PROGRESS=$((NO_PROGRESS + 1))
              echo "::warning::브랜치 $B: 수확 진행 없음(${HARVESTED}개 그대로) ${NO_PROGRESS}/${MAX_NO_PROGRESS}회"
              if [ "$NO_PROGRESS" -ge "$MAX_NO_PROGRESS" ]; then
                echo "::warning::브랜치 $B: ${MAX_NO_PROGRESS}회 연속 무진전 — 큐텐 장애 가능성, 이번 실행 중단(다음 트리거에서 재시도)"
                break
              fi
            else
              NO_PROGRESS=0
            fi
          done

  merge_fullcatalog_shards:
    # [수확 통합] 12워커가 각자 쓴 fullcatalog_state_<0~11>.json을
    # fullcatalog_state.json 하나로 합친다. discovery_state.json(발굴
    # 병합본)과는 완전히 별도 파일로 저장하되, 겹치는 상품(goods_no
    # 동일)은 발굴 쪽을 우선시켜서 수확본에서 제외한다 — 사용자 지시.
    #
    # [경합 방지] merge_discovery_shards와 동일한 원칙 — 수확 워커
    # 12개가 fullcatalog-live에 계속 커밋하는 동안 병합이 같이 돌면
    # push 경합만 반복하다 타임아웃난다(실측 확인된 사고, discovery
    # 쪽에서 동일 패턴 겪음). 병합 시작 전 수확 워커를 일시정지하고,
    # 끝나면 재기동한다.
    if: github.event_name == 'workflow_dispatch' && inputs.run_merge_harvest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-fullcatalog-shards-queue
      cancel-in-progress: false
    steps:
      - name: Pause harvest workers (avoid merge push contention)
        run: |
          echo "[일시정지] 수확 워커가 돌고 있으면 병합 전에 세운다"
          RUNS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20")
          IDS=$(echo "$RUNS_JSON" | jq -r --argjson me "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id != $me) | select(.name=="Qoo10 Pipeline") | .id')
          for RID in $IDS; do
            JOBS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/jobs?per_page=30")
            HAS_HARVEST=$(echo "$JOBS_JSON" | jq -r '[.jobs[] | select(.status=="in_progress") | select(.name | contains("harvest_full_catalog"))] | length')
            if [ "$HAS_HARVEST" != "0" ]; then
              echo "[취소] run $RID (수확 워커 포함, 병합 push 경합 방지)"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/cancel"
            fi
          done
          sleep 30

      - uses: actions/checkout@v4

      - name: Switch to dedicated branch
        run: |
          git fetch origin fullcatalog-live 2>/dev/null && git checkout fullcatalog-live || git checkout -b fullcatalog-live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge fullcatalog shards (discovery 우선 중복제외)
        working-directory: src
        run: |
          for i in $(seq 1 15); do
            git fetch origin fullcatalog-live 2>/dev/null
            git reset --hard origin/fullcatalog-live -q 2>/dev/null || true
            git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true

            # 발굴본(discovery-live)은 읽기만 한다 — FETCH_HEAD 사용 이유는
            # harvest_full_catalog_parallel job과 동일(얕은클론이라
            # origin/discovery-live 참조가 안 만들어짐, 실측 확인됨).
            git fetch origin discovery-live 2>/dev/null
            git show FETCH_HEAD:output/discovery_state.json > ../output/discovery_state_readonly.json 2>/dev/null || echo '{"all_products":[]}' > ../output/discovery_state_readonly.json

            python merge_fullcatalog_states.py ../output ../output/discovery_state_readonly.json

            git add ../output/fullcatalog_state.json 2>/dev/null || true
            git diff --cached --quiet && { echo "합칠 변경사항 없음"; break; }
            git commit -m "Auto: merge fullcatalog shards (발굴우선 중복제외)"
            if git push origin fullcatalog-live; then echo "수확 병합 push 성공"; break; fi
            sleep_time=$((RANDOM % 6 + 1))
            echo "push 실패(경합), ${sleep_time}초 대기 후 재시도 ($i/15)"
            sleep "$sleep_time"
          done

      # [제거됨] 수확 번역/검증/검수 스텝 — 사용자 방침에 따라 수확
      # 상품은 검수 대상이 아니라 '발굴 검색어 재료'로만 쓴다(수확에서
      # 한 단계 더 정제한 게 발굴이므로). Claude API 번역도 전부 걷어냈다.


      - name: Resume harvest workers after merge
        if: always()
        run: |
          echo "[재기동] 수확 워커를 다시 켠다"
          SUCCESS=0
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/resume_harvest_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qoo10-pipeline.yml/dispatches" \
              -d '{"ref":"main","inputs":{"run_harvest_catalog":"true"}}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "[재기동 성공] ($i/5)"
              SUCCESS=1
              break
            fi
            echo "[재기동 실패] HTTP $HTTP_CODE ($i/5): $(cat /tmp/resume_harvest_resp.json)"
            sleep $((i * 5))
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "::error::수확 워커 재기동 5회 전부 실패 — 수동으로 run_harvest_catalog을 트리거해야 함"
            exit 1
          fi

  merge_discovery_shards:
    # [1.5단계] 12개 워커가 각자 쓴 discovery_state_<0~11>.json을 하나의
    # discovery_state.json으로 합친다. 순수 파일 I/O만 하므로(웹 스크래핑
    # 없음) 몇 초~몇십 초 안에 끝난다 — 수집 워커의 속도(상점당 몇십 초씩)에
    # 전혀 영향받지 않는, 완전히 독립된 가벼운 단계.
    #
    # [트리거 방식 — 시간 기반, 개수 기반 아님] 아래 if 조건에 있듯, 이
    # job은 workflow_dispatch로 run_merge_discovery=true를 명시적으로
    # 넘겨야만 실행된다. 발굴 워커가 상품을 몇 개 모았는지와는 무관하다.
    # cron-job.org가 매시 정각에 이 입력값으로 호출하는 방식으로만 돈다
    # (README 참고). "신규상품 N개마다 자동 트리거"하는 코드는 발굴 워커
    # (discover_low_review_shops_parallel) 어디에도 없다 — 예전 주석이
    # 실제 구현과 다르게 남아있던 것이었다. 그래서 발굴 재시작 직후처럼
    # 상품이 아직 안 쌓인 시점에 정각이 걸리면, 병합이 텅 빈 스냅샷을
    # 찍어갈 수 있다(실측 확인: 재시작 4분 후 병합 시각에 상품 0건이었음).
    #
    # [번역도 여기서] 번역 API 호출은 워커 12곳이 아니라 이 한 곳에서만
    # 한다 — 그래야 배치를 크게 모을 수 있고, 2단계(검증)가 보는
    # 파일(discovery_state.json)과 번역상태가 항상 일치한다. 병합 직후
    # 미번역 상품이 100개 이상 쌓이면 번역하고, 다시 push한다.
    #
    # [자동연계] 번역이 실제로 일어났으면(=검증할 새 대상이 생겼으면)
    # 2단계(hwahae_verify)를 자동으로 트리거해서 사람 개입 없이 이어지게
    # 한다.
    if: github.event_name == 'workflow_dispatch' && inputs.run_merge_discovery
    runs-on: ubuntu-latest
    # [상향] 번역 대기물량이 3,514건까지 쌓여 20분 안에 못 끝나고 도중에
    # 취소되는 사고가 실측 확인됐다(13:43 시작 -> 14:04 취소, 번역
    # 커밋 못함). 발굴 일시정지로 push 경합은 이미 없앴으니, 이제
    # 병목은 순수하게 번역 API 호출 시간이다. 60분으로 늘려 대응한다.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-discovery-shards-queue
      cancel-in-progress: false
    steps:
      - name: Pause discovery workers (avoid merge push contention)
        run: |
          # [신규] 발굴 워커 12개가 discovery-live에 초 단위로 계속 커밋하는
          # 동안 병합/번역이 같이 돌면, 병합의 push가 계속 경합에 밀려
          # 재시도만 반복하다 20분 타임아웃으로 통째로 취소된다(실측 확인:
          # 상품 1,332건까지 쌓였는데 번역 0건인 채 취소됨). 병합 시작 전에
          # 발굴 워커가 포함된 다른 실행을 먼저 세운다 — 이 job이 끝나면
          # 마지막 스텝에서 다시 켠다(아래 참고).
          echo "[일시정지] 발굴 워커가 돌고 있으면 병합 전에 세운다"
          RUNS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20")
          IDS=$(echo "$RUNS_JSON" | jq -r --argjson me "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id != $me) | select(.name=="Qoo10 Pipeline") | .id')
          for RID in $IDS; do
            JOBS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/jobs?per_page=30")
            HAS_DISCOVER=$(echo "$JOBS_JSON" | jq -r '[.jobs[] | select(.status=="in_progress") | select(.name | contains("discover_low_review_shops"))] | length')
            if [ "$HAS_DISCOVER" != "0" ]; then
              echo "[취소] run $RID (발굴 워커 포함, 병합 push 경합 방지)"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/cancel"
            fi
          done
          echo "[대기] 취소된 워커가 실제로 멈출 시간을 준다"
          sleep 30

      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - name: Switch to dedicated branch
        run: |
          git fetch origin discovery-live 2>/dev/null && git checkout discovery-live || git checkout -b discovery-live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [필수] 이 스텝이 빠져 있어서 번역이 v1.4.17 낡은 코드로 돌았다.
          # 브랜드사전 힌트(v1.4.54)도 생략금지 규칙(v1.4.58)도 안 걸린 채
          # 수천 건을 한 통에 보내다 응답이 잘렸고, 2,035건(80.8%)이
          # 일본어인 채로 굳었다. 다른 job과 동일하게 항상 main 최신코드로
          # 맞춘다(브랜치 고유의 output/ 데이터는 안 건드림).
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ comparison/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge all worker shards into discovery_state.json
        working-directory: src
        run: |
          for i in $(seq 1 15); do
            git fetch origin discovery-live 2>/dev/null
            git reset --hard origin/discovery-live -q
            # reset --hard가 위에서 맞춰둔 최신코드까지 되돌려버리므로 매번 다시 맞춘다.
            git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true
            python merge_discovery_states.py ../output
            python append_progress_history.py ../output
            # [버그수정, 실측 발생] archive/ 폴더가 없을 때 git add가 나열된
            # 경로 전체를 통째로 실패시켜서, 병합이 상품 458건을 정상적으로
            # 만들어놓고도 discovery_state.json이 스테이징조차 안 돼 그대로
            # 유실됐다(git diff --cached --quiet가 "변경없음"으로 잘못
            # 보고함 — 사실은 아무것도 안 올라가서 비교할 게 없었을 뿐).
            # archive/는 있을 때만 별도로 add한다.
            git add ../output/discovery_state.json ../output/progress_history.json 2>/dev/null || true
            [ -d ../output/archive ] && git add ../output/archive/ 2>/dev/null || true
            git diff --cached --quiet && { echo "합칠 변경사항 없음"; break; }
            git commit -m "Auto: merge discovery shards (1.5단계)"
            if git push origin discovery-live; then echo "병합 push 성공"; break; fi
            sleep_time=$((RANDOM % 6 + 1))
            echo "push 실패(경합), ${sleep_time}초 대기 후 재시도 ($i/15)"
            sleep "$sleep_time"
          done

      - name: Export untranslated products to Excel
        working-directory: src
        run: |
          # [번역 방식 전환] Claude API 자동번역을 전부 걷어냈다. 대신
          # 미번역 상품을 엑셀로 뽑아 사용자가 직접 번역해 다시 넣는다.
          # (사용자 방침: 번역은 별도 Claude 창에서 처리)
          python export_untranslated.py ../output/discovery_state.json ../output/미번역상품.xlsx
          git add ../output/미번역상품.xlsx 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto: export untranslated products to Excel"
            for i in $(seq 1 10); do
              git push origin discovery-live && break
              sleep $((RANDOM % 5 + 1))
              git fetch origin discovery-live 2>/dev/null
              git reset --hard origin/discovery-live -q 2>/dev/null || true
              git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true
              python export_untranslated.py ../output/discovery_state.json ../output/미번역상품.xlsx
              git add ../output/미번역상품.xlsx 2>/dev/null || true
              git diff --cached --quiet || git commit -m "Auto: export untranslated products to Excel (재시도)"
            done
          fi


      - name: Resume discovery workers after merge+translate
        if: always() && inputs.hold_discovery != true
        run: |
          # [신규] 맨 처음 스텝에서 세운 발굴 워커를 여기서 다시 켠다.
          # if: always()라서 병합/번역이 타임아웃/실패해도 반드시 재기동한다
          # — 안 그러면 발굴이 영영 멈춘 채로 방치된다.
          #
          # [실패시 대비] curl -s만 쓰면 dispatch가 실패해도(네트워크 문제,
          # 토큰 권한 문제, API 순간장애 등) 아무 표시 없이 조용히 넘어가고
          # 발굴은 다음 정각까지(혹은 그 이후로도 계속) 멈춘 채로 방치된다.
          # 이제 HTTP 상태코드를 직접 확인해서 5회까지 재시도하고, 그래도
          # 실패하면 ::error::로 워크플로 자체를 실패 처리해서 눈에 띄게 한다.
          echo "[재기동] 발굴 워커를 다시 켠다"
          SUCCESS=0
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/resume_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qoo10-pipeline.yml/dispatches" \
              -d '{"ref":"main","inputs":{"run_discovery":"true","discovery_parallel":"true"}}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "[재기동 성공] ($i/5)"
              SUCCESS=1
              break
            fi
            echo "[재기동 실패] HTTP $HTTP_CODE ($i/5): $(cat /tmp/resume_resp.json)"
            sleep $((i * 5))
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "::error::발굴 워커 재기동 5회 전부 실패 — 발굴이 멈춘 채로 남아있음. 수동으로 run_discovery+discovery_parallel을 트리거해야 함"
            exit 1
          fi

  ensure_discovery_alive:
    # [안전망 — 매시 정각마다 독립적으로 재확인] merge_discovery_shards의
    # 마지막 스텝이 발굴을 재기동하지만, 그마저 5회 재시도 다 실패하면
    # (::error::로 표시는 되지만) 발굴은 여전히 멈춘 채로 남는다. 이
    # job은 needs로 merge가 끝난 뒤에 실행되고, if: always()라서 merge가
    # 실패했어도 반드시 돈다 — "병합의 재기동 성공 여부"와 무관하게,
    # 매시 외부크론(cron-job.org)이 올 때마다 "지금 발굴이 실제로 살아
    # 있는지"를 독립적으로 다시 확인해서, 죽어있으면 그때 다시 켠다.
    # 그래서 이번 시간에 재기동이 실패해도 다음 정각에는 반드시 복구된다.
    needs: merge_discovery_shards
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_merge_discovery && inputs.hold_discovery != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check whether any discovery worker is currently running
        id: check
        run: |
          RUNS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20")
          IDS=$(echo "$RUNS_JSON" | jq -r --argjson me "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id != $me) | select(.name=="Qoo10 Pipeline") | .id')
          ALIVE=0
          for RID in $IDS; do
            JOBS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/jobs?per_page=30")
            HAS_DISCOVER=$(echo "$JOBS_JSON" | jq -r '[.jobs[] | select(.status=="in_progress") | select(.name | contains("discover_low_review_shops"))] | length')
            if [ "$HAS_DISCOVER" != "0" ]; then
              ALIVE=1
              break
            fi
          done
          echo "alive=$ALIVE" >> "$GITHUB_OUTPUT"
          if [ "$ALIVE" = "1" ]; then
            echo "[정상] 발굴 워커가 이미 살아있음 — 재기동 불필요"
          else
            echo "[복구필요] 발굴 워커가 하나도 안 돌고 있음 — 다시 켠다"
          fi

      - name: Revive discovery workers if none are running
        if: steps.check.outputs.alive == '0'
        run: |
          SUCCESS=0
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/revive_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qoo10-pipeline.yml/dispatches" \
              -d '{"ref":"main","inputs":{"run_discovery":"true","discovery_parallel":"true"}}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "[복구 성공] ($i/5)"
              SUCCESS=1
              break
            fi
            echo "[복구 실패] HTTP $HTTP_CODE ($i/5): $(cat /tmp/revive_resp.json)"
            sleep $((i * 5))
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "::error::안전망 복구도 5회 전부 실패 — 그래도 다음 정각에 이 job이 다시 확인한다"
            exit 1
          fi

  hwahae_verify:
    # 번역완료된 상품을 화해/네이버/무신사/Exa 4곳에서 검증해 정식
    # 브랜드+상품명+구매링크를 가져온다. 매 건마다 즉시 저장하므로
    # 타임아웃 걸려도 재실행하면 이어서 진행된다.
    #
    # [3워커 샤딩] 검증이 전체 파이프라인의 유일한 병목이었다(실측:
    # 1.5건/분, 남은 3,147건이면 35시간). 발굴(12워커)/수확(6워커)에서
    # 이미 검증된 샤딩 방식을 적용해 3워커로 나눈다 — 각 워커가
    # goods_no 해시로 자기 몫만 처리하고 자기 전용 파일에만 쓴다.
    #
    # [3으로 시작하는 이유] 6워커면 5.8시간으로 더 빠르지만, 화해/무신사는
    # 공식 API가 아니라 브라우저 스크래핑이라 사이트 부하가 6배가 된다.
    # 3워커(11.7시간, 사이트당 4.5req/분) + 요청간 1초 지연으로 시작해서,
    # 기술적 실패율을 보고 올릴지 판단한다. GH Actions는 잡마다 IP가
    # 달라서 IP당 요청속도는 1워커일 때와 동일하다.
    if: github.event_name == 'workflow_dispatch' && inputs.run_hwahae_verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        # [1 -> 3 증설, v3.1.0] 평상시 하루 물량(164건)은 1워커로 충분하지만,
        # 밀린 백로그 3,079건은 1워커로 34시간(240분 타임아웃 기준 9회
        # 재실행)이 걸린다. 3워커면 11.4시간이다. 화해/무신사는 공식 API가
        # 아니라 브라우저 스크래핑이라 6워커는 사이트 부하가 과하다고 보고
        # 3에서 멈춘다(GH Actions는 잡마다 IP가 달라 IP당 요청속도는 1워커와
        # 동일하고, 요청간 1초 지연도 그대로 유지된다).
        # ⚠️ 이 개수를 바꾸면 아래 나눗셈(% 3) 두 곳도 반드시 같이 고칠 것.
        shard: [0, 1, 2]
      fail-fast: false
    concurrency:
      group: hwahae-verify-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - name: Switch to dedicated branch (avoids push contention with discover)
        run: |
          git fetch origin hwahae-live 2>/dev/null && git checkout hwahae-live || git checkout -b hwahae-live
          git merge origin/main --no-edit -X theirs 2>/dev/null || true
          # [안전장치] merge가 조용히 실패해서 코드 파일이 낡은 채로 남는
          # 사고가 실측으로 확인됐다(translate_in_place.py 없어서 8워커
          # 전부 크래시). merge 성공여부와 무관하게 항상 최신 코드로
          # 강제 동기화한다(각 브랜치 고유의 output/ 데이터는 안 건드림).
          git fetch origin main 2>/dev/null
          git checkout origin/main -- src/ data/ comparison/ VERSION requirements.txt 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (캐시 miss일 때만)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (캐시 hit여도 필요)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run hwahae verification in chunks (checkable mid-run)
        working-directory: src
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # [v3.3.0] 다음(Daum) 웹문서 검색용. 없으면 다음 소스만 조용히
          # 빠지고(빈 결과 취급) 나머지 소스로 정상 진행한다.
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # [1,2단계 통합] 더 이상 translate-live 브랜치가 없다 — 발굴과
          # 번역이 이제 discovery-live에서 함께 이뤄진다. 병합된
          # discovery_state.json에서 translated_kr이 채워진 항목만 뽑아
          # hwahae_verify_batch.py가 기대하는 형식으로 변환한다.
          git fetch origin discovery-live 2>/dev/null
          git show origin/discovery-live:output/discovery_state.json > /tmp/ds_for_verify.json 2>/dev/null || echo '{"all_products":[]}' > /tmp/ds_for_verify.json
          S="${{ matrix.shard }}"
          # [샤딩] goods_no를 zlib.crc32(결정적 해시)로 3등분해서 자기 몫만
          # 가져온다. 파이썬 내장 hash()는 프로세스마다 랜덤이라 재실행할
          # 때마다 배정이 바뀌는 버그가 되므로 쓰지 않는다(수확 워커에서
          # 이미 겪고 고친 문제).
          python3 -c "
          import json, zlib
          state = json.load(open('/tmp/ds_for_verify.json'))
          rows = [{'goods_no': p['goods_no'], 'translated_kr': p['translated_kr'], 'known_brand': p.get('known_brand','')}
                  for p in state.get('all_products', []) if p.get('translated_kr')]
          mine = [r for r in rows if zlib.crc32(str(r['goods_no']).encode()) % 3 == $S]  # 나눗셈은 워커수(3)와 일치
          json.dump(mine, open('../output/hwahae_input_${S}.json','w'), ensure_ascii=False, indent=2)
          print(f'[INFO] 전체 {len(rows)}건 중 샤드${S} 몫 {len(mine)}건')
          "

          # [이미 검증된 것 승계 + 재샤딩] 기존 통합본(hwahae_verified_39.json)과
          # 자기 전용 파일에 이미 처리된 항목이 있으면 자기 샤드분만 골라
          # 시작점으로 삼는다 — 안 그러면 이미 끝낸 걸 처음부터 다시 검증한다.
          #
          # [v3.1.0 변경 — 파일이 있어도 매번 돈다] 예전엔 '파일이 없을 때'만
          # 돌았다. 그러면 워커수를 바꾼 직후(1->3), 예전 나눗셈(% 1)으로
          # 만들어진 샤드0 파일에 다른 샤드 몫이 그대로 남아 있어서
          # DONE/TOTAL 카운트가 어긋나고(남의 몫까지 세서 조기 '완료' 판정),
          # 같은 상품을 두 워커가 중복 검증한다. 매번 자기 몫만 남기도록
          # 걸러내면 워커수를 바꿔도 안전하다.
          python3 -c "
          import json, pathlib, zlib
          out = pathlib.Path('../output')
          pool = {}
          for name in ('hwahae_verified_39.json', 'hwahae_verified_${S}.json'):
              p = out / name
              if p.exists():
                  for x in json.loads(p.read_text()):
                      pool[x['goods_no']] = x
          mine = [x for x in pool.values() if zlib.crc32(str(x['goods_no']).encode()) % 3 == $S]  # 나눗셈은 워커수(3)와 일치
          json.dump(mine, open('../output/hwahae_verified_${S}.json','w'), ensure_ascii=False, indent=2)
          print(f'[INFO] 기존 검증 {len(pool)}건 중 샤드${S} 몫 {len(mine)}건 승계')
          "

          TOTAL=$(python3 -c "import json; print(len(json.load(open('../output/hwahae_input_${S}.json'))))")
          CHUNK=10
          VNOPROG=0
          MAX_VNOPROG=3  # 연속 무진전 허용(hwahae_verify_batch의 재시도 3회와 맞춤)
          while true; do
            DONE_BEFORE=$(python3 -c "import json,pathlib; p=pathlib.Path('../output/hwahae_verified_${S}.json'); print(len(json.loads(p.read_text())) if p.exists() else 0)")
            if [ "$DONE_BEFORE" -ge "$TOTAL" ]; then
              echo "샤드$S 전부 완료됨 ($DONE_BEFORE/$TOTAL)"
              break
            fi
            # [v3.1.2] 어떤 이유로든 파일이 사라졌으면 백업에서 되살린 뒤 진행한다.
            [ -f ../output/hwahae_verified_${S}.json ] || cp /tmp/vshard_backup.json ../output/hwahae_verified_${S}.json 2>/dev/null || true
            [ -f ../output/hwahae_input_${S}.json ] || cp /tmp/vinput_backup.json ../output/hwahae_input_${S}.json 2>/dev/null || true
            echo "::group::샤드$S 처리 $DONE_BEFORE/$TOTAL 부터 최대 $CHUNK건"
            python hwahae_verify_batch.py ../output/hwahae_input_${S}.json ../output/hwahae_verified_${S}.json "$CHUNK"
            echo "::endgroup::"

            # [v3.1.1 — 검증결과 유실 사고 수정] 백업은 반드시 push '전에'
            # 떠야 한다. 예전엔 push 블록이 끝난 뒤에 백업했는데, push가
            # 경합으로 밀리면 재시도 경로의 `git reset --hard`가 방금 만든
            # 결과파일을 지우고, 복원해야 할 /tmp 백업은 (첫 청크라) 아직
            # 존재하지 않아 파일 자체가 사라졌다. 그 다음 루프에서
            # FileNotFoundError로 job이 죽었고 검증 39건이 통째로 날아갔다
            # (실측 2026-07-28 03:04, run 30324712542).
            cp ../output/hwahae_verified_${S}.json /tmp/vshard_backup.json 2>/dev/null || true
            # [v3.1.2] 입력파일도 같이 백업한다. reset --hard는 '이번 커밋에서
            # 새로 생긴 파일'을 전부 지우므로 결과파일만 지켜서는 부족했다
            # (실측 2026-07-28 03:23, run 30325602811: 결과는 살았는데
            # hwahae_input_1.json이 사라져 다음 청크가 FileNotFoundError로 죽음).
            cp ../output/hwahae_input_${S}.json /tmp/vinput_backup.json 2>/dev/null || true

            python append_progress_history.py ../output
            # [버그 수정 - 재확인중 발견] retry_state 파일(hwahae_verify_
            # batch.py의 기술적실패 재시도 카운트)이 git add에 빠져있었다.
            # GitHub Actions는 매번 새 VM이라, 커밋 안 하면 이 파일은
            # 그 VM이 사라질 때 같이 사라진다 — 그러면 재시도 카운트가
            # 매번 0부터 다시 시작해서 "3회 실패시 포기" 안전장치가
            # 실제로는 절대 발동 안 하고 무한 재시도만 반복하게 된다.
            #
            # [18번 버그 재발방지] 이 파일은 기술적실패가 한 번도 없으면
            # 아예 안 만들어질 수 있는 선택적 파일이다(archive/와 같은
            # 부류). 필수 파일과 같은 git add에 섞으면, 이 파일이 없을 때
            # pathspec 오류로 전체가 통째로 실패한다(과거실패 #18과 동일
            # 패턴 재발 위험) — 그래서 반드시 존재할 때만 별도로 add한다.
            # [샤딩] 자기 전용 파일에만 쓴다 — 워커끼리 같은 파일을 건드리지
            # 않으므로 push 경합이 거의 없다(발굴/수확과 동일 원칙).
            git add ../output/hwahae_verified_${S}.json ../output/hwahae_input_${S}.json 2>/dev/null || true
            [ -f ../output/hwahae_verified_${S}.retry_state.json ] && git add ../output/hwahae_verified_${S}.retry_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto: hwahae verification shard $S progress"
              for i in $(seq 1 15); do
                if git push origin hwahae-live; then break; fi
                sleep_time=$((RANDOM % 8 + 2))
                echo "push 실패, ${sleep_time}초 대기 후 재시도 ($i/15)"
                sleep "$sleep_time"
                git fetch origin hwahae-live 2>/dev/null
                git reset --hard origin/hwahae-live -q 2>/dev/null || true
                git checkout origin/main -- src/ data/ VERSION 2>/dev/null || true
                cp /tmp/vshard_backup.json ../output/hwahae_verified_${S}.json 2>/dev/null || true
                cp /tmp/vinput_backup.json ../output/hwahae_input_${S}.json 2>/dev/null || true
                git add ../output/hwahae_verified_${S}.json ../output/hwahae_input_${S}.json 2>/dev/null || true
                git diff --cached --quiet || git commit -m "Auto: hwahae verification shard $S progress (재시도)"
              done
            fi
            # [v3.1.1] 결과파일이 어떤 이유로든 사라졌으면 백업에서 되살린다.
            # 예전엔 여기서 json.load를 그냥 호출해서 파일이 없으면
            # FileNotFoundError로 job 전체가 죽었다.
            [ -f ../output/hwahae_verified_${S}.json ] || cp /tmp/vshard_backup.json ../output/hwahae_verified_${S}.json 2>/dev/null || true
            DONE_AFTER=$(python3 -c "import json,pathlib; p=pathlib.Path('../output/hwahae_verified_${S}.json'); print(len(json.loads(p.read_text())) if p.exists() else 0)")
            # [v1.16.5와 동일한 수정 - 검증 루프에도 적용] 기술적 실패로
            # '보류'된 상품은 results에 안 들어가므로 DONE 카운트가 안 오른다.
            # CHUNK가 2건뿐이라 그 2건이 다 보류되면 즉시 '진행 없음'으로
            # 판정돼 루프가 끝나버렸다(실측: 3건만 처리하고 종료). 그러면
            # hwahae_verify_batch.py의 MAX_VERIFY_RETRIES(3회) 재시도 로직이
            # 한 실행 안에서 절대 완주하지 못한다. 연속 무진전을 허용해서
            # 재시도가 자연히 소진되게 하되, 그 이상이면 진짜 장애로 보고 중단.
            if [ "$DONE_AFTER" -eq "$DONE_BEFORE" ]; then
              VNOPROG=$((VNOPROG + 1))
              echo "::warning::검증 진행 없음 ${VNOPROG}/${MAX_VNOPROG}회 (기술적실패 재시도 중일 수 있음)"
              if [ "$VNOPROG" -ge "$MAX_VNOPROG" ]; then
                echo "${MAX_VNOPROG}회 연속 무진전 — 중단"
                break
              fi
            else
              VNOPROG=0
            fi
          done

      - name: Translate Korean product names to Japanese (DISABLED)
        working-directory: src
        run: |
          # [사용자 지시로 완전 비활성화] 한->일 역번역(검수페이지 비교용
          # 부가기능)을 API 비용 관리를 위해 막는다. translate_kr_to_jp.py
          # 자체는 삭제하지 않고 그대로 남겨둔다(나중에 다시 켤 수 있게).
          # build_review.py는 kr_to_jp_translations.json이 없으면 빈
          # 딕셔너리로 폴백하도록 이미 설계돼 있어서(파일이 없어도 페이지
          # 생성 자체는 실패하지 않음), 이 스텝을 완전히 건너뛰어도 안전함.
          echo "[비활성화] 한->일 역번역은 사용자 지시로 막혀있음 — API 호출 없음"

      - name: Merge verification shards and build review pages
        # [샤딩 대응] 워커 3개가 각자 hwahae_verified_<S>.json에 쓰므로,
        # 검수페이지를 만들기 전에 하나로 합쳐야 한다. 셋이 동시에 합치면
        # 서로 덮어쓰니 샤드0만 담당한다(다른 샤드는 이 스텝을 건너뜀).
        if: matrix.shard == 0
        working-directory: src
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 다른 샤드들이 push한 최신 결과를 받아온다.
          git fetch origin hwahae-live 2>/dev/null
          git checkout FETCH_HEAD -- output/ 2>/dev/null || true

          python3 -c "
          import json, pathlib, glob
          out = pathlib.Path('../output')
          merged = {}
          # 기존 통합본을 먼저 깔고(다른 샤드가 아직 안 올린 과거분 보존),
          # 샤드 파일로 덮어쓴다(샤드 쪽이 항상 더 최신).
          p = out / 'hwahae_verified_39.json'
          if p.exists():
              for x in json.loads(p.read_text()): merged[x['goods_no']] = x
          n_shard = 0
          for f in sorted(out.glob('hwahae_verified_[0-9].json')):
              for x in json.loads(f.read_text()):
                  merged[x['goods_no']] = x; n_shard += 1
          rows = list(merged.values())
          p.write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          print(f'[검증통합] 샤드에서 {n_shard}건 -> 통합본 {len(rows)}건 (구매링크 {sum(1 for x in rows if x.get(\"product_url\"))}건)')
          "

          git add ../output/hwahae_verified_39.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto: merge verification shards"
            for i in $(seq 1 10); do
              git push origin hwahae-live && break
              sleep $((RANDOM % 5 + 1)); git pull --rebase origin hwahae-live -q || true
            done
          fi

          # 병합본(discovery-live)의 최신 discovery_state.json을 가져온다.
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git discovery-live
          git show FETCH_HEAD:output/discovery_state.json > ../output/discovery_state.json || true
          python build_review_batches.py || echo "[경고] 리뷰페이지 생성 실패(데이터 부족 등) — 다음 검증때 재시도됨"

      - name: Push generated docs/ to main (GitHub Pages source)
        if: matrix.shard == 0
        run: |
          # docs/는 GitHub Pages 소스라 main 브랜치에 있어야 한다. 지금 이
          # job의 워킹디렉토리는 hwahae-live라서, main만 별도 폴더에
          # 클론해서 거기에 docs/를 복사해넣고 그쪽에서 커밋+push한다
          # (현재 브랜치 전환 없이 안전하게 처리).
          if [ ! -d docs ] || [ -z "$(ls -A docs 2>/dev/null)" ]; then
            echo "[스킵] docs/ 없음(리뷰페이지 생성 자체가 안 됨)"
            exit 0
          fi
          rm -rf /tmp/main_for_docs
          git clone --depth 1 --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/main_for_docs
          rm -rf /tmp/main_for_docs/docs
          cp -r docs /tmp/main_for_docs/docs
          cd /tmp/main_for_docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "[정보] docs/ 변경사항 없음"
          else
            git commit -m "Auto: publish updated review pages after stage-2 verification"
            for i in $(seq 1 10); do
              if git push origin main; then echo "push 성공"; break; fi
              sleep_time=$((RANDOM % 6 + 1))
              echo "push 실패, ${sleep_time}초 대기 후 재시도 ($i/10)"
              sleep "$sleep_time"
              git pull --rebase origin main -q
            done
          fi

  naver_api_test:
    # 네이버쇼핑 검색 API 테스트 — 이 샌드박스에선 openapi.naver.com이
    # 네트워크 정책으로 차단되어 있어서, GitHub Actions 러너에서 대신 실행한다.
    if: github.event_name == 'workflow_dispatch' && inputs.naver_test_query != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: hwahae-brand-lookup-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages
          playwright install --with-deps chromium
      - name: Test Naver Shopping Search API
        working-directory: src
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python naver_shop_search.py \
            "케라스타즈 디스인탱글 샴푸" \
            "Verish 실리콘 데미누브라"

      - name: Install Playwright for gallery test
        run: |
          pip install playwright --break-system-packages
          playwright install --with-deps chromium

      - name: Test product gallery scraper
        working-directory: src
        run: |
          python product_gallery.py "https://smartstore.naver.com/main/products/10035737872"

      - name: Collect OY Global brands, romanize-match remaining Korean brands, merge confirmed results
        working-directory: src
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python collect_oy_global_brands.py
          python match_oy_global_brands.py ../data/still_unmatched_korean_brands.json ../data/oliveyoung_global_brands.json /tmp/oy_global_matches.json 85
          echo "=== 결과 ==="
          cat /tmp/oy_global_matches.json
          python3 -c "import json; existing = json.load(open('../data/brand_translations_learned.json')); new = json.load(open('/tmp/oy_global_matches.json')); before = len(existing); existing.update(new); json.dump(existing, open('../data/brand_translations_learned.json', 'w'), ensure_ascii=False, indent=2); print(f'사전 {before}개 -> {len(existing)}개 ({len(existing)-before}개 신규 추가)')"
          git add ../data/brand_translations_learned.json ../data/oliveyoung_global_brands.json
          git diff --cached --quiet || git commit -m "Auto: OY Global romanization-match brand additions"
          for i in $(seq 1 10); do
            if git push origin main; then echo "push 성공"; break; fi
            sleep_time=$((RANDOM % 6 + 1))
            echo "push 실패, ${sleep_time}초 대기 후 재시도 ($i/10)"
            sleep "$sleep_time"
            git pull --rebase origin main -q
          done


      - name: Full hwahae brand lookup (chunked, background, self-retriggers)
        working-directory: src
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python hwahae_brand_lookup.py ../data/oliveyoung_pending_brands.json /tmp/hwahae_new_mappings.json 400
          echo "=== 결과 ==="
          cat /tmp/hwahae_new_mappings.json
          python3 -c "import json; existing = json.load(open('../data/brand_translations_learned.json')); new = json.load(open('/tmp/hwahae_new_mappings.json')); before = len(existing); existing.update(new); json.dump(existing, open('../data/brand_translations_learned.json', 'w'), ensure_ascii=False, indent=2); print(f'사전 {before}개 -> {len(existing)}개 ({len(existing)-before}개 신규 추가)')"
          git add ../data/brand_translations_learned.json ../data/oliveyoung_pending_brands.json
          git diff --cached --quiet || git commit -m "Auto: hwahae brand lookup batch (chunk of up to 400)"
          for i in $(seq 1 10); do
            if git push origin main; then echo "push 성공"; break; fi
            sleep_time=$((RANDOM % 6 + 1))
            echo "push 실패, ${sleep_time}초 대기 후 재시도 ($i/10)"
            sleep "$sleep_time"
            git pull --rebase origin main -q
          done
          REMAINING=$(python3 -c "import json; print(len(json.load(open('../data/oliveyoung_pending_brands.json'))))")
          if [ "$REMAINING" -gt 0 ]; then
            echo "[자동트리거] 남은 브랜드 ${REMAINING}개 -> 다음 배치 트리거"
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qoo10-pipeline.yml/dispatches" \
              -d '{"ref":"main","inputs":{"naver_test_query":"hwahae_brand_next_batch"}}'
          fi


  build_excel:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show pipeline code version
        run: echo "[VERSION] $(cat VERSION 2>/dev/null || echo unknown) (commit ${{ github.sha }})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build excel for each updated korea_side.json
        working-directory: src
        run: |
          # [버그수정, 재확인중 발견] 매칭되는 파일이 없으면 bash 글롭이
          # 확장 안 되고 리터럴 문자열("../output/*_korea_side.json")
          # 그대로 넘어가서 python이 "파일 없음" 오류를 낸다. nullglob을
          # 켜서 매칭 없으면 반복문 자체가 그냥 안 돌게 한다.
          shopt -s nullglob
          for f in ../output/*_korea_side.json; do
            base=$(basename "$f" _korea_side.json)
            python excel_builder.py "$f" "../output/${base}_비교.xlsx"
          done
          shopt -u nullglob

      - name: Commit excel output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [버그수정, 재확인중 발견] output/*.xlsx가 하나도 없으면 글롭이
          # 리터럴 문자열로 넘어가 git add가 pathspec 오류로 실패한다
          # (과거실패 #18과 같은 부류 — 존재 안 할 수 있는 경로를 무방비로
          # git add에 넘김). nullglob으로 매칭 없으면 빈 배열이 되게 하고,
          # 실제로 매칭된 게 있을 때만 add한다.
          shopt -s nullglob
          xlsx_files=(output/*.xlsx)
          shopt -u nullglob
          if [ ${#xlsx_files[@]} -gt 0 ]; then
            git add "${xlsx_files[@]}"
          else
            echo "[정보] 새로 생성된 xlsx 없음 — add 생략"
          fi
          git diff --cached --quiet || git commit -m "Auto: build comparison excel"
          git push
